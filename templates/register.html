{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro"><p class="eyebrow">JOIN SH OPEASE</p><h1>Shopping made a little simpler.</h1><p>Create an account to place orders and track their progress.</p></div>
  <form class="form-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2>Create account</h2><p class="muted">It only takes a minute.</p>
    <label>Full name<input type="text" name="name" required maxlength="100" autocomplete="name" placeholder="Your name"></label>
    <label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label>
    <button class="button primary full-width" type="submit">Create account</button>
    <p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}
