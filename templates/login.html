{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro"><p class="eyebrow">WELCOME BACK</p><h1>Your next great find is waiting.</h1><p>Sign in to manage your cart and follow your orders.</p></div>
  <form class="form-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2>Log in</h2><p class="muted">Enter your account details below.</p>
    <label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label>
    <button class="button primary full-width" type="submit">Log in</button>
    <p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
